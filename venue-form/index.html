<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>課後活動場地借用申請表產生器</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"DFKai-SB","BiauKai","標楷體","Noto Serif TC","PMingLiU",serif;background:#e8e8e8;color:#000}
.app{display:flex;gap:16px;padding:16px;align-items:flex-start}
.panel{width:380px;flex:none;background:#fff;padding:14px;border-radius:8px;font-family:system-ui,"Noto Sans TC",sans-serif;font-size:14px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.panel h1{font-size:17px;margin:0 0 10px}
.panel fieldset{border:1px solid #ccc;border-radius:6px;margin:0 0 10px;padding:8px 10px}
.panel legend{font-weight:700;padding:0 4px}
.panel label{display:block;margin:5px 0}
.panel input[type=text],.panel input[type=tel],.panel input[type=date],.panel input[type=time],.panel input[type=number],.panel textarea{width:100%;padding:4px 6px;font:inherit;border:1px solid #bbb;border-radius:4px}
.row{display:flex;gap:6px;align-items:center}.row>*{flex:1}
.chk{display:inline-block;margin-right:10px}
.slot{display:grid;grid-template-columns:16px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) 24px;gap:4px;align-items:center;margin:4px 0}
.slot button{padding:2px}.slot input{padding:2px 3px!important;font-size:12px!important}
button{font:inherit;cursor:pointer}
.btn{padding:6px 12px;border:1px solid #888;border-radius:4px;background:#f4f4f4}
.btn.primary{background:#1a5fb4;color:#fff;border-color:#1a5fb4}
.hint{color:#666;font-size:12px}
.preview{flex:1;overflow:auto}
.sheet{width:210mm;height:297mm;background:#fff;margin:0 auto 16px;padding:7mm 9mm;box-shadow:0 1px 6px #0004;position:relative;overflow:hidden}
.sheet.two{display:flex;flex-direction:column;justify-content:space-between}
.cut{text-align:center;font-size:10px;color:#444;letter-spacing:1px;white-space:nowrap;overflow:hidden;margin:1mm 0}
.form{font-size:12px;line-height:1.35}
.form.big{font-size:13.5px;line-height:1.5}
.form h2{text-align:center;font-size:19px;margin:0 0 2mm;letter-spacing:1px}
.form.big h2{font-size:23px;margin-bottom:4mm}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #000;padding:1mm 1.6mm;vertical-align:middle}
th{font-weight:400;text-align:center;white-space:nowrap;width:22mm}
.form.big td,.form.big th{padding:2mm 2mm}
.sign td{height:11mm;border-top:none}
.form.big .sign td{height:17mm}
.sign th{border-bottom:none;width:25%}
.sign.low td{height:11mm}
.note{font-size:12px;margin-top:1mm;text-align:center}
.form.big .note{font-size:13.5px;margin-top:2mm}
.slotline{display:block;padding:.4mm 0}
.timeline{display:flex;flex-wrap:wrap}
.timeline .slotline{width:100%}
.u{display:inline-block;min-width:1.4em;text-align:center;border-bottom:1px solid #000;line-height:1.1}
.copy{float:right;font-size:11px}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .panel,.noprint{display:none!important}
  .app{display:block;padding:0}
  .preview{overflow:visible}
  .sheet{margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
}
@media (max-width:900px){.app{flex-direction:column}.panel{width:100%;position:static;max-height:none}.preview{width:100%}.sheet{transform-origin:top left}}
</style>
</head>
<body>
<div class="app">
<div class="panel noprint">
  <h1>場地借用申請表產生器</h1>
  <fieldset><legend>過去的申請</legend>
    <select id="hist" style="width:100%;padding:4px"></select>
    <div class="row" style="margin-top:6px"><button class="btn" id="histLoad">載入並修改</button><button class="btn" id="histSave">儲存這次申請</button><button class="btn" id="histDel">刪除</button></div>
    <div id="unlockBox" style="display:none;margin:6px 0"><label>輸入申請人電話末三碼,查詢公開的過去紀錄<input type="text" id="code" inputmode="numeric" maxlength="3" placeholder="例如 123"></label><button class="btn" id="unlockBtn" style="margin-top:4px">查詢</button></div>
    <div class="hint" id="histNote">查到的公開紀錄標示【公開】,不能在這裡刪除;你自己儲存的只存在這台瀏覽器。</div>
    <div class="hint">載入後會保留基本資料、場地、名單,申請日期改為今天;時段日期若已過期會清空,未來的會保留。下載 PDF 時會自動存一筆。</div>
  </fieldset>
  <fieldset><legend>基本資料</legend>
    <label>社團名稱<input type="text" id="club"></label>
    <div class="row"><label>社長班級<input type="text" id="pcls" placeholder="2年8班"></label><label>社長姓名<input type="text" id="pname"></label></div>
    <div class="row"><label>申請人班級座號<input type="text" id="acls" placeholder="2年8班1號"></label><label>申請人姓名<input type="text" id="aname"></label></div>
    <label>申請人手機<input type="tel" id="aphone"></label>
    <label>申請日期<input type="date" id="adate"></label>
  </fieldset>
  <fieldset><legend>借用場地</legend>
    <div id="venues"></div>
    <label>其他場地<input type="text" id="vother"></label>
    <label>借用班級教室(例:2年8班)<input type="text" id="vclass"></label>
    <label>教室班導簽名處<span class="hint">(留白供手簽)</span></label>
  </fieldset>
  <fieldset><legend>場地衛生負責人</legend>
    <label><input type="checkbox" id="sameAsApplicant" checked> 同申請人</label>
    <div id="sanBox" style="display:none">
      <div class="row"><label>班級座號<input type="text" id="scls"></label><label>姓名<input type="text" id="sname"></label></div>
      <label>手機<input type="tel" id="sphone"></label>
    </div>
  </fieldset>
  <fieldset><legend>借用時間 <span id="cnt" class="hint"></span></legend>
    <div id="slots"></div>
    <button class="btn" id="addSlot">＋ 新增時段</button>
    <div class="hint" style="margin-top:6px">≤3 筆:列印第 1 頁(A4 上下兩聯)。<br>4～12 筆:列印第 2、3 頁(社團活動組聯、總務處聯各一頁)。</div>
  </fieldset>
  <fieldset><legend>借用事由 / 名單</legend>
    <label>借用事由<textarea id="reason" rows="2"></textarea></label>
    <label>總人數(留空=依名單行數計算)<input type="number" min="0" id="total"></label>
    <label>使用場地人員名單(一行一人,或用頓號/逗號分隔)<textarea id="members" rows="4"></textarea></label>
  </fieldset>
  <div class="row"><button class="btn primary" id="pdf">下載 PDF</button><button class="btn" id="reset">清空表單</button></div>
  <div style="margin-top:6px"><button class="btn" id="gdrive" style="display:none;width:100%">存到我的 Google 雲端(PDF)</button><div id="gdriveOut" class="hint"></div></div>
  <p class="hint">資料會存在這台瀏覽器裡,下次開啟自動帶入。※借用前 3 天提出申請。</p>
</div>
<div class="preview" id="preview"></div>
</div>

<script>
const VENUES=["熱舞大合旁","棒球草皮","芷韻風操","康輔風操","中正川堂","中正體育館舞台"];
const MAX=12, KEY="venueForm.v1";
// 自動上傳到你的 Google 雲端(見 apps-script/Code.gs 與 README.md);留空則不上傳
/*UPLOAD-START*/const UPLOAD_URL="", UPLOAD_TOKEN="";/*UPLOAD-END*/
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WD="日一二三四五六";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const defaults=()=>({club:"",pcls:"",pname:"",acls:"",aname:"",aphone:"",adate:today(),
  venues:[],vother:"",vclass:"",same:true,scls:"",sname:"",sphone:"",reason:"",members:"",total:"",slots:[{date:"",start:"16:00",end:"18:00"}]});
let S=defaults();try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}

// ---------- panel ----------
$("venues").innerHTML=VENUES.map((v,i)=>`<label class="chk"><input type="checkbox" data-v="${v}"> ${v}</label>`).join("");
const textIds=["club","pcls","pname","acls","aname","aphone","adate","vother","vclass","scls","sname","sphone","reason","members","total"];
function load(){
  textIds.forEach(id=>$(id).value=S[id]||"");
  document.querySelectorAll("[data-v]").forEach(c=>c.checked=S.venues.includes(c.dataset.v));
  $("sameAsApplicant").checked=S.same; $("sanBox").style.display=S.same?"none":"block";
  renderSlots();
}
function renderSlots(){
  $("slots").innerHTML=S.slots.map((s,i)=>`<div class="slot"><span>${i+1}</span>
    <input type="date" data-i="${i}" data-k="date" value="${s.date}">
    <input type="time" data-i="${i}" data-k="start" value="${s.start}">
    <input type="time" data-i="${i}" data-k="end" value="${s.end}">
    <button data-del="${i}" title="刪除">✕</button></div>`).join("");
  $("addSlot").disabled=S.slots.length>=MAX;
  $("cnt").textContent=`(${S.slots.length}/${MAX},${S.slots.length<=3?"第1頁":"第2、3頁"})`;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
textIds.forEach(id=>$(id).addEventListener("input",()=>{S[id]=$(id).value;save()}));
document.querySelectorAll("[data-v]").forEach(c=>c.addEventListener("change",()=>{
  S.venues=[...document.querySelectorAll("[data-v]")].filter(x=>x.checked).map(x=>x.dataset.v);save()}));
$("sameAsApplicant").addEventListener("change",e=>{S.same=e.target.checked;$("sanBox").style.display=S.same?"none":"block";save()});
$("slots").addEventListener("input",e=>{const t=e.target;if(t.dataset.k){S.slots[+t.dataset.i][t.dataset.k]=t.value;save()}});
$("slots").addEventListener("click",e=>{const d=e.target.dataset.del;if(d!=null){S.slots.splice(+d,1);if(!S.slots.length)S.slots.push({date:"",start:"16:00",end:"18:00"});renderSlots();save()}});
$("addSlot").onclick=()=>{if(S.slots.length>=MAX)return;const l=S.slots[S.slots.length-1]||{};S.slots.push({date:"",start:l.start||"16:00",end:l.end||"18:00"});renderSlots();save()};
function toast(t){let e=$("toast");if(!e){e=document.createElement("div");e.id="toast";e.className="noprint";e.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font:14px system-ui,sans-serif;z-index:9;max-width:90vw";document.body.appendChild(e)}e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",6000)}
$("reset").onclick=()=>twice("reset","要清空目前表單?",()=>{try{localStorage.removeItem(KEY)}catch(e){}S=defaults();load();render()});

// ---------- form rendering ----------
function parts(dstr){ // ROC y, m, d, weekday
  if(!dstr)return null;const [y,m,d]=dstr.split("-").map(Number);
  return {y:y-1911,m,d,w:WD[new Date(y,m-1,d).getDay()]};
}
const blank=(t,w)=>`<span class="u" style="min-width:${w||1.6}em">${t??""}</span>`;
function slotLine(i,s){
  const p=parts(s&&s.date);
  const [sh,sm]=(s&&s.start?s.start:"").split(":"),[eh,em]=(s&&s.end?s.end:"").split(":");
  return `(${i+1})自${blank(p&&p.y,2.2)}年${blank(p&&p.m)}月${blank(p&&p.d)}日（週${blank(p&&p.w,1)}）`+
   `${blank(sh)}時${blank(sm)}分至${blank(eh)}時${blank(em)}分`;
}
function members(){
  const list=S.members.split(/[\n,，、;；]+/).map(x=>x.trim()).filter(Boolean);
  return list;
}
function form(label,rows,big,extra){
  const p=parts(S.adate);
  const venue=VENUES.map(v=>`${S.venues.includes(v)?"☑":"□"}${v}`);
  const other=`${S.vother?"☑":"□"}其他${S.vother?esc(S.vother):"＿＿＿＿＿"}`;
  const room=`${S.vclass?"☑":"□"}借用${S.vclass?esc(S.vclass):"＿＿＿"}班級教室`;
  const sanit=S.same?`${esc(S.acls)} 姓名:${esc(S.aname)}　手機號碼:${esc(S.aphone)}`:
    `${esc(S.scls)} 姓名:${esc(S.sname)}　手機號碼:${esc(S.sphone)}`;
  const slots=Array.from({length:rows},(_,i)=>S.slots[i]);
  const over=S.slots.some(s=>s.end&&s.end>"18:00");
  let time;
  if(big){
    time=`<div class="timeline">${slots.map((s,i)=>`<span class="slotline">${slotLine(i,s)}</span>`).join("")}</div>
      <div style="margin-top:2mm">${over?"☑":"□"}練習超過18:00　　督導教師簽名：＿＿＿＿＿＿＿＿＿</div>
      <div style="font-size:.9em">(如督導教師臨時無法督導僅練到18:00)</div>`;
  }else{
    time=slots.map((s,i)=>`<span class="slotline">${slotLine(i,s)}${i==0?`　${over?"☑":"□"}練習超過18:00`:""}${(i==1||(rows==1&&i==0))?"　督導教師簽名：＿＿＿＿＿＿":""}</span>`).join("")+`<span class="slotline" style="font-size:.9em">(如督導教師臨時無法督導僅練到18:00)</span>`;
  }
  const m=members();
  const mem=m.length?m.map((x,i)=>`(${i+1})${esc(x)}`).join("；"):"(1)　　　；(2)　　　；(3)";
  return `<div class="form ${big?"big":""}">
  <h2>新北市立永平高中課後活動場地借用申請表 <span class="copy">${label}</span></h2>
  <table>
   <tr><th>社團名稱</th><td>${esc(S.club)}</td><th>社長</th><td>${esc(S.pcls)}　姓名:${esc(S.pname)}</td></tr>
   <tr><th>申請人</th><td colspan="2">${esc(S.acls)}　姓名:${esc(S.aname)}　手機號碼:${esc(S.aphone)}</td><td>申請日期 ${p?`${p.y}年${p.m}月${p.d}日 星期${p.w}`:"　年　月　日 星期　"}</td></tr>
   <tr><th>借用場地</th><td colspan="3">${venue.join("　")}<br>${other}　　${room}　借用教室班導簽名：＿＿＿＿＿＿</td></tr>
   <tr><th style="white-space:normal">場地衛生<br><small>(復原、電源關閉與檢查負責人)</small></th><td colspan="3">${sanit}</td></tr>
   <tr><th style="white-space:normal">借用時間<br><small>24時制填寫</small></th><td colspan="3" style="vertical-align:middle;${big?"":"height:23mm"}">${time}</td></tr>
   <tr><th>借用事由</th><td colspan="3" style="height:${big?"16mm":"9mm"}">${esc(S.reason)}</td></tr>
   <tr><th style="white-space:normal">使用場地人員名單</th><td colspan="3" style="height:${big?"22mm":"10mm"}">${(S.total||m.length)?`總人數:${S.total||m.length}人　`:""}${mem}</td></tr>
  </table>
  <table class="sign" style="margin-top:-1px">
   <tr><th>社團組長</th><th>衛生組</th><th>生輔組</th><th>體育組</th></tr><tr><td></td><td></td><td></td><td></td></tr>
  </table>
  <table class="sign" style="margin-top:-1px">
   <tr><th>學務主任</th><th>總務處幹事</th><th>總務處事務組長</th><th>總務主任</th></tr><tr><td></td><td></td><td></td><td></td></tr>
  </table>
  <div class="note">${extra}</div></div>`;
}
const N1="※借用前3天提出申請表　※申請人要負責場地清潔、電源、門窗開關　※須遵守時間與警衛指導　(社團活動組留存聯)";
const N2="提醒:※請同學務必遵守時間與警衛大哥指導　(總務處留存聯)";
const CUT="✂-------✂-------✂-------✂-------✂-------✂-------✂-------✂-------✂-------✂-------✂-------✂-------✂-------✂-------✂-------✂-------✂";
function render(){
  const n=S.slots.length;let html;
  if(n<=3){
    html=`<div class="sheet two">${form("社團活動組留存聯",n,false,N1)}<div class="cut">${CUT}</div>${form("總務處留存聯",n,false,N2)}</div>`;
  }else{
    html=`<div class="sheet">${form("社團活動組留存聯",n,true,N1)}</div><div class="sheet">${form("總務處留存聯",n,true,N2)}</div>`;
  }
  $("preview").innerHTML=html;
}

// ---------- history ----------
const HKEY=KEY+".hist";
/*SEED-START*/const SEED=[];/*SEED-END*/
let H=[];try{H=JSON.parse(localStorage.getItem(HKEY)||"[]")}catch(e){}
try{if(SEED.length&&!localStorage.getItem(HKEY+".seeded")){H=H.concat(SEED);localStorage.setItem(HKEY+".seeded","1");histSave()}}catch(e){}
function histSave(){try{localStorage.setItem(HKEY,JSON.stringify(H))}catch(e){}}
function histLabel(h){const d=h.data,f=d.slots.find(x=>x.date);
  return `${h.at.slice(0,16).replace("T"," ")}｜${d.club||"(未填社團)"}｜${d.venues.concat(d.vother?[d.vother]:[]).join("、")||"(未選場地)"}｜${d.slots.length}筆${f?"｜"+f.date:""}`}
/*PUB-START*/const PUB_ENC=null;/*PUB-END*/
let UNLOCKED=[];
const allH=()=>UNLOCKED.concat(H).sort((a,b)=>a.at<b.at?1:-1);
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function unlock(code){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(PUB_ENC.salt),iterations:PUB_ENC.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  let n=0;
  for(const it of PUB_ENC.items){
    try{
      const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(it.iv)},key,b64d(it.ct));
      const data=JSON.parse(new TextDecoder().decode(pt));
      if(!UNLOCKED.some(u=>u.at===it.at)){UNLOCKED.push({at:it.at,data,ro:true});n++}
    }catch(e){}
  }
  return n;
}
function renderHist(){
  const L=allH();
  $("hist").innerHTML=L.length?L.map((h,i)=>`<option value="${i}">${h.ro?"【公開】":""}${esc(histLabel(h))}</option>`).join(""):'<option value="">(尚無紀錄)</option>';
}
let col=null;
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function saveHistory(quiet){
  const snap=JSON.stringify(S);
  if(H[0]&&JSON.stringify(H[0].data)===snap){if(!quiet)toast("這筆內容已存過了");return}
  const at=new Date().toISOString();
  if(col){
    Promise.resolve(col.doc(newId()).set({at,json:snap})).then(()=>{if(!quiet)toast("已存到共用紀錄")}).catch(e=>toast("存到共用紀錄失敗:"+(e&&e.message||e)));
    return;
  }
  H.unshift({at,data:JSON.parse(snap)});H=H.slice(0,30);histSave();renderHist();if(!quiet)toast("已存到這台瀏覽器");
}
$("histSave").onclick=()=>saveHistory(false);
$("histLoad").onclick=()=>{const h=allH()[+$("hist").value];if(!h)return;
  S=Object.assign(defaults(),JSON.parse(JSON.stringify(h.data)));
  S.adate=today();S.slots=S.slots.map(x=>({date:(x.date&&x.date>=today())?x.date:"",start:x.start,end:x.end}));
  load();save()};
let armed={};
function twice(key,msg,fn){if(armed[key]){clearTimeout(armed[key]);armed[key]=0;fn();return}toast(msg+"(再按一次確認)");armed[key]=setTimeout(()=>armed[key]=0,5000)}
$("histDel").onclick=()=>{const r=allH()[+$("hist").value];if(!r)return;
  if(r.ro){toast("【公開】的紀錄不能在這裡刪除,請洽管理員");return}
  twice("del","要刪除這筆紀錄?",()=>{
    if(col&&r.id){Promise.resolve(col.doc(r.id).delete()).then(()=>toast("已刪除")).catch(e=>toast("刪除失敗:"+(e&&e.message||e)))}
    else{const k=H.indexOf(r);if(k>=0){H.splice(k,1);histSave();renderHist()}}})};
if(PUB_ENC){$("unlockBox").style.display="block";
  const go=async()=>{const c=$("code").value.trim();if(!/^\d{3}$/.test(c)){toast("請輸入 3 位數字");return}
    try{const n=await unlock(c);renderHist();toast(n?"找到 "+n+" 筆符合的公開紀錄":"沒有符合的紀錄")}catch(e){toast("驗證失敗:"+(e&&e.message||e))}};
  $("unlockBtn").onclick=go;$("code").addEventListener("keydown",e=>{if(e.key==="Enter")go()})}
renderHist();
async function initShared(){
  try{
    if(!(window.claude&&claude.use))return;
    const db=await claude.use("db");if(!db)return;
    const c=db.collection("records");
    const rows=snap=>{const out=[];const add=d=>{const x=(typeof d.data==="function"?d.data():d.data)||{};try{out.push({id:d.id,at:x.at||"",data:JSON.parse(x.json)})}catch(e){}};
      if(snap.forEach)snap.forEach(add);else(snap.docs||[]).forEach(add);
      out.sort((a,b)=>a.at<b.at?1:-1);return out};
    const LOCAL=H.slice();let migrated=false;
    const migrate=cur=>{if(migrated)return;migrated=true;
      try{if(localStorage.getItem(HKEY+".migrated"))return}catch(e){}
      const have=new Set(cur.map(r=>JSON.stringify(r.data)));let n=0;
      LOCAL.forEach(r=>{const k=JSON.stringify(r.data);if(have.has(k))return;have.add(k);n++;c.doc(newId()).set({at:r.at,json:k})});
      try{localStorage.setItem(HKEY+".migrated","1")}catch(e){}
      if(n)toast("已把這台瀏覽器的 "+n+" 筆舊紀錄匯入共用紀錄")};
    c.orderBy("at","desc").limit(100).onSnapshot(snap=>{col=c;H=rows(snap);migrate(H);renderHist();$("histNote").textContent="共用紀錄:被邀請的人都看得到,也都能新增或刪除。"},
      e=>{col=null;toast("共用紀錄讀取失敗,改用這台瀏覽器的紀錄")});
  }catch(e){col=null}
}
initShared();

// ---------- PDF ----------
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector('script[src="'+src+'"]'))return ok();const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=()=>no(new Error("load "+src));document.head.appendChild(e)})}
async function makePdf(){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
  const sheets=[...document.querySelectorAll(".sheet")],imgs=[];
  for(let i=0;i<sheets.length;i++){
    const c=await html2canvas(sheets[i],{scale:2,backgroundColor:"#ffffff",useCORS:true});
    const url=c.toDataURL("image/jpeg",0.88);imgs.push(url);
    if(i)pdf.addPage();
    pdf.addImage(url,"JPEG",0,0,210,297);
  }
  return {blob:pdf.output("blob"),imgs};
}
function pdfName(){const f=S.slots.find(x=>x.date);return `場地借用單_${S.club||"未填社團"}${f?"_"+f.date:""}.pdf`}
function showImages(imgs){
  let o=$("imgOverlay");if(o)o.remove();
  o=document.createElement("div");o.id="imgOverlay";o.className="noprint";
  o.style.cssText="position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;padding:12px;font:14px system-ui,sans-serif";
  o.innerHTML='<div style="max-width:820px;margin:0 auto"><button class="btn primary" id="imgClose">關閉</button> <span>長按(手機)或按右鍵(電腦)圖片即可另存,也可以截圖。</span>'+
    imgs.map((u,i)=>`<img src="${u}" alt="第${i+1}頁" style="display:block;width:100%;margin:10px 0;border:1px solid #ccc">`).join("")+'</div>';
  document.body.appendChild(o);$("imgClose").onclick=()=>o.remove();
}
$("pdf").onclick=async()=>{
  const btn=$("pdf"),t=btn.textContent;btn.disabled=true;btn.textContent="產生中…";
  try{
    saveHistory(true);
    const {blob,imgs}=await makePdf(),name=pdfName();
    let saved=false,inRuntime=!!(window.claude&&claude.use);
    if(inRuntime){
      try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data:blob});saved=true}}catch(e){}
      if(!saved){showImages(imgs);toast("無法直接下載(僅限組織成員),已改為顯示圖片,可長按或按右鍵另存。");btn.disabled=false;btn.textContent=t;return}
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    }
    if(UPLOAD_URL){
      blobToB64(blob).then(b64=>fetch(UPLOAD_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:UPLOAD_TOKEN,filename:name,base64:b64})}))
        .then(r=>r.json()).then(j=>toast(j&&j.ok?"已同步存到管理員的雲端":"同步到管理員雲端失敗:"+((j&&j.error)||"未知原因")))
        .catch(()=>toast("無法確認是否已同步到管理員雲端,請稍後洽管理員"));
    }
    toast("PDF 已產生:"+name);
  }catch(e){toast("產生 PDF 失敗:"+(e&&e.message||e)+"。請檢查網路後再試一次。")}
  btn.disabled=false;btn.textContent=t;
};

// ---------- Google Drive upload (viewer's own connector) ----------
let MCPS=null;
(async()=>{try{if(!(window.claude&&claude.use))return;const m=await claude.use("mcp");if(!m)return;MCPS=m;$("gdrive").style.display="block"}catch(e){}})();
const blobToB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(b)});
$("gdrive").onclick=async()=>{
  const btn=$("gdrive"),t=btn.textContent,out=$("gdriveOut");btn.disabled=true;btn.textContent="產生並上傳中…";out.textContent="";
  try{
    saveHistory(true);
    const {blob}=await makePdf(),name=pdfName();
    const b64=await blobToB64(blob);
    const srv=await MCPS.server("Google Drive");
    const res=await srv.create_file({title:name,base64Content:b64,contentMimeType:"application/pdf",disableConversionToGoogleType:true});
    const p=(res&&res.payload)||res||{};
    const link=p.webViewLink||p.url||(p.id?"https://drive.google.com/file/d/"+p.id+"/view":"");
    out.innerHTML=link?`已上傳:<a href="${esc(link)}" target="_blank" rel="noopener">${esc(name)}</a>(預設只有你自己能開,要分享請在 Google 雲端設定)`:`已上傳到你的 Google 雲端:${esc(name)}`;
  }catch(e){out.textContent="上傳失敗:"+(e&&(e.message||e.code)||e)}
  btn.disabled=false;btn.textContent=t;
};
load();render();
