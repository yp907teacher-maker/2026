name: 每日整合腳本（產生 report.json）

# 目前僅手動觸發；等 Phase 5 做完 Email 通知後，會改成台灣時間 06:00 開盤前
# 的排程（cron），屆時抓資料→報告→Email 會在同一次執行內完成。
on:
  workflow_dispatch:
    inputs:
      strategy:
        description: '要套用的策略 JSON 檔名（位於 strategies/）'
        required: false
        default: 'strategy_momentum.json'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行每日整合腳本
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/daily_pipeline.py "${{ inputs.strategy }}"

      - name: 提交 report.json 與狀態檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "沒有新的變更" || git commit -m "chore: 更新每日報告 $(date -u +%Y-%m-%d)"
          git push
