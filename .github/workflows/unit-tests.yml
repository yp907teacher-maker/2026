name: 單元測試（策略引擎／預測模組）

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'strategies/**'
      - 'tests/**'
      - 'requirements*.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝相依套件
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 執行測試
        run: pytest tests/ -v
